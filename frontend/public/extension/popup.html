<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remotely</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 360px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #09090b;
      color: #fafafa;
    }
    
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #27272a;
      background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
    }
    
    .logo {
      width: 32px;
      height: 32px;
      background: #6366f1;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo svg {
      width: 18px;
      height: 18px;
      color: white;
    }
    
    .title {
      font-size: 18px;
      font-weight: 700;
    }
    
    .badge {
      font-size: 10px;
      padding: 2px 8px;
      background: #27272a;
      border-radius: 10px;
      color: #a1a1aa;
      margin-left: auto;
    }
    
    .content {
      padding: 16px;
    }
    
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      background: #18181b;
      border-radius: 10px;
      margin-bottom: 16px;
      border: 1px solid #27272a;
    }
    
    .status-icon {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
    
    .status-icon.error {
      background: #ef4444;
    }
    
    .status-text {
      font-size: 12px;
      color: #a1a1aa;
    }
    
    .job-preview {
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    
    .job-preview.detected {
      border-color: #6366f1;
      background: linear-gradient(180deg, rgba(99, 102, 241, 0.1) 0%, #18181b 100%);
    }
    
    .job-label {
      font-size: 10px;
      text-transform: uppercase;
      color: #6366f1;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    
    .job-title {
      font-size: 14px;
      font-weight: 600;
      color: #fafafa;
      margin-bottom: 4px;
      line-height: 1.3;
    }
    
    .job-company {
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 8px;
    }
    
    .job-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      color: #71717a;
    }
    
    .job-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    .form-group {
      margin-bottom: 12px;
    }
    
    .form-label {
      display: block;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 6px;
      font-weight: 500;
    }
    
    .form-input {
      width: 100%;
      padding: 10px 12px;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      color: #fafafa;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    
    .form-input:focus {
      border-color: #6366f1;
    }
    
    .form-input::placeholder {
      color: #52525b;
    }
    
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    
    .btn-primary {
      background: #6366f1;
      color: white;
    }
    
    .btn-primary:hover {
      background: #4f46e5;
    }
    
    .btn-primary:disabled {
      background: #3f3f46;
      cursor: not-allowed;
    }
    
    .btn-secondary {
      background: #27272a;
      color: #fafafa;
      margin-top: 8px;
    }
    
    .btn-secondary:hover {
      background: #3f3f46;
    }
    
    .success-message {
      display: none;
      text-align: center;
      padding: 24px;
    }
    
    .success-message.show {
      display: block;
    }
    
    .success-icon {
      width: 48px;
      height: 48px;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }
    
    .success-icon svg {
      width: 24px;
      height: 24px;
      color: white;
    }
    
    .success-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .success-text {
      font-size: 13px;
      color: #a1a1aa;
    }
    
    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 12px;
      color: #f87171;
      margin-bottom: 12px;
      display: none;
    }
    
    .error-message.show {
      display: block;
    }
    
    .settings-link {
      display: block;
      text-align: center;
      font-size: 11px;
      color: #6366f1;
      text-decoration: none;
      margin-top: 16px;
      padding: 8px;
      border-radius: 6px;
    }
    
    .settings-link:hover {
      background: rgba(99, 102, 241, 0.1);
    }
    
    .hidden {
      display: none !important;
    }
    
    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
    
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect width="20" height="14" x="2" y="7" rx="2" ry="2"/>
        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
      </svg>
    </div>
    <span class="title">Remotely</span>
    <span class="badge">Tracker</span>
  </div>

  <div class="content">
    <!-- Connection Status -->
    <div class="status" id="connectionStatus">
      <div class="status-icon" id="statusIcon"></div>
      <span class="status-text" id="statusText">Connecté à votre dashboard</span>
    </div>

    <!-- Main Form -->
    <div id="mainForm">
      <!-- Detected Job Preview -->
      <div class="job-preview detected" id="jobPreview">
        <div class="job-label">Offre détectée</div>
        <div class="job-title" id="previewTitle">Chargement...</div>
        <div class="job-company" id="previewCompany"></div>
        <div class="job-meta">
          <span class="job-meta-item" id="previewLocation"></span>
          <span class="job-meta-item" id="previewSalary"></span>
        </div>
      </div>

      <!-- Error Message -->
      <div class="error-message" id="errorMessage"></div>

      <!-- Form Fields -->
      <div class="form-group">
        <label class="form-label">Titre du poste *</label>
        <input type="text" class="form-input" id="jobTitle" placeholder="Ex: Développeur Full Stack">
      </div>

      <div class="form-group">
        <label class="form-label">Entreprise *</label>
        <input type="text" class="form-input" id="jobCompany" placeholder="Ex: TechCorp">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Localisation</label>
          <input type="text" class="form-input" id="jobLocation" placeholder="Remote, France">
        </div>
        <div class="form-group">
          <label class="form-label">Salaire</label>
          <input type="text" class="form-input" id="jobSalary" placeholder="45-60k€">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Notes</label>
        <input type="text" class="form-input" id="jobNotes" placeholder="Vos notes personnelles...">
      </div>

      <button class="btn btn-primary" id="saveBtn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
          <polyline points="17 21 17 13 7 13 7 21"/>
          <polyline points="7 3 7 8 15 8"/>
        </svg>
        Sauvegarder dans Remotely
      </button>

      <a href="#" class="settings-link" id="openDashboard">
        Ouvrir le dashboard →
      </a>
    </div>

    <!-- Success Message -->
    <div class="success-message" id="successMessage">
      <div class="success-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="success-title">Offre sauvegardée !</div>
      <div class="success-text">L'offre a été ajoutée à votre dashboard</div>
      <button class="btn btn-secondary" id="addAnotherBtn">
        Ajouter une autre offre
      </button>
      <a href="#" class="settings-link" id="viewInDashboard">
        Voir dans le dashboard →
      </a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
